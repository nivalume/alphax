[workspace]
resolver = "3"
members = [
  "crates/alphax",
  "crates/alphax-core",
  "crates/alphax-model",
  "crates/alphax-exec",
  "crates/alphax-generic",
  "crates/alphax-indicators",
  "crates/alphax-sim",
  "crates/alphax-py",
  "crates/alphax-records",
  "crates/alphax-signals",
  "crates/alphax-analysis",
  "crates/alphax-expr",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/nivalume/alphax"
description = "Parallel factor-driven vectorized backtesting engine"

[workspace.dependencies]
rayon = "1.10"

criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
polars = { version = "0.46", default-features = false, features = [
  "abs",
  "cov",
  "cse",
  "ewma",
  "fused",
  "lazy",
  "log",
  "rolling_window",
  "sign",
] }
alphax-analysis = { path = "crates/alphax-analysis", version = "0.3.0" }
alphax-core = { path = "crates/alphax-core", version = "0.3.0" }
alphax-exec = { path = "crates/alphax-exec", version = "0.3.0" }
alphax-generic = { path = "crates/alphax-generic", version = "0.3.0" }
alphax-indicators = { path = "crates/alphax-indicators", version = "0.3.0" }
alphax-expr = { path = "crates/alphax-expr", version = "0.3.0" }
alphax-model = { path = "crates/alphax-model", version = "0.3.0" }
alphax-records = { path = "crates/alphax-records", version = "0.3.0" }
alphax-signals = { path = "crates/alphax-signals", version = "0.3.0" }
alphax-sim = { path = "crates/alphax-sim", version = "0.3.0" }


[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
# The simulation kernels keep their arithmetic exactly, not idiomatic Rust.
# These lints fire constantly on it and hide real findings.
too_many_arguments = "allow"
# Deliberate: financial comparisons go through `alphax_core::math`, never `==`.
float_cmp = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Benchmarks must not be built in debug; debug builds of the
# simulation kernels are ~50x slower and produce meaningless numbers.
[profile.bench]
inherits = "release"
debug = true
