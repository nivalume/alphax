[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphax-lab"
version = "0.1.0"
description = "Pre-registered factor research protocol on alphax"
requires-python = ">=3.10"
dependencies = ["alphax-trader[data]", "numpy", "pyyaml", "pymupdf", "openai>=1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
alphax-lab = "alphax_lab.cli:main"

[tool.setuptools.packages.find]
include = ["alphax_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
