[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphax"
version = "0.1.0"
description = "Pluggable, LLM-driven alpha research and mining platform built on LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph>=1.0",
  "litellm>=1.50",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "tables>=3.8",
]

[project.optional-dependencies]
qlib = ["pyqlib"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.8"]

[tool.setuptools.packages.find]
include = ["alphax*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.j2", "templates/*.j2", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "qlib: end-to-end tests that need an importable qlib installation",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
